<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>html,body{height:100%;margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Реестр подрядчиков и поставщиков</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky bar on top; left rail lists work types in the order a house is built (geodesy -> landscaping); main column is a dense scannable list; one side panel for every form. */
:root{
  color-scheme:light;
  --bg:#F2F4F8; --surface:#FFFFFF; --raise:#F6F8FB; --ink:#1A2233; --muted:#667085; --line:#E2E6ED;
  --accent:#2F5FDB; --accent-ink:#FFFFFF; --soft:#E7EDFC;
  --ok:#14734A; --ok-bg:#DBF2E5; --warn:#8F5B00; --warn-bg:#FBEBC6; --bad:#B42318; --bad-bg:#FBE0DC; --new:#566176; --new-bg:#E8EBF1;
  --s1:#3B82F6; --s2:#B7791F; --s3:#E0592A; --s4:#7C3AED; --s5:#0E9AA7; --s6:#3F9B2F; --s7:#64748B; --s8:#BE185D;
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 12px 40px rgba(20,30,55,.16);
  --rowh:52px; --pad:16px;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- auth ---------- */
.auth{min-height:100%;display:grid;place-items:center;padding:48px 16px}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:16px}
.mark{font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px}
.mark i{width:14px;height:14px;background:var(--accent);display:block;clip-path:polygon(0 100%,0 35%,50% 0,100% 35%,100% 100%)}
.auth h1{font-size:22px;margin:0;line-height:1.2;text-wrap:balance}
.auth p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:500;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px}
textarea.inp{resize:vertical;min-height:76px}
.check{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:14px;margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}

/* ---------- app shell ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--raise);border-radius:9px;padding:3px}
.tab{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.search{flex:1 1 220px;min-width:0}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.wrap.one{grid-template-columns:minmax(0,1fr)}

.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.rail-i,.stage-h{width:100%;border:0;background:transparent;text-align:left;border-radius:8px;height:40px;padding:0 12px;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14.5px}
.rail-i span,.stage-h span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-i:hover,.stage-h:hover{background:var(--raise)}
.rail-i[aria-current="true"],.stage-h[aria-current="true"]{background:var(--soft);color:var(--accent);font-weight:500}
.rail-i b,.stage-h b{font-weight:400;color:var(--muted);font-size:13px;min-width:22px;text-align:right}
.stage-h{font-weight:500}
.stage-h .chev{width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin-left:6px;display:inline-block;transition:transform .12s}
.stage-h[aria-expanded="true"] .chev{transform:rotate(45deg)}
.stage-h .cnt2{display:flex;align-items:center}
.stage-b .rail-i{height:36px;font-size:14px}
.stage-b .rail-i.zero{color:var(--muted)}
.rail hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--s7);display:inline-block}
.rail-select{display:none}

.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px;min-height:44px}
.tools h2{margin:0;font-size:19px;font-weight:600;line-height:1.2;flex:1 1 200px;min-width:0}
.tools h2 small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.tools select{height:40px;min-height:40px;padding:0 10px;width:auto;max-width:100%;flex:0 1 200px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pill{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--soft);border-color:var(--soft);color:var(--accent);font-weight:500}

.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.25fr) minmax(0,.65fr) 132px 64px 158px;gap:var(--pad);padding:0 var(--pad);height:var(--rowh);border-top:1px solid var(--line);align-items:center;cursor:pointer}
.row>*{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.head{height:40px;cursor:default;border-top:0;background:var(--raise);font-size:13px;color:var(--muted)}
.row:not(.head):hover{background:var(--raise)}
.r-name b{font-weight:500}
.r-name span{color:var(--muted);margin-left:8px;font-size:14px}
.r-types{display:flex;align-items:center;gap:8px;font-size:14px}
.r-types span{overflow:hidden;text-overflow:ellipsis}
.r-types em{font-style:normal;color:var(--muted);font-size:13px;flex:none}
.r-city{font-size:14px;color:var(--muted)}
.r-phones{text-align:right;font-variant-numeric:tabular-nums}
.r-sub{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.phone{display:flex;gap:6px;align-items:center;white-space:nowrap}
.tap{border:0;background:none;padding:0;font-variant-numeric:tabular-nums;color:var(--ink);cursor:copy}
.tap:hover{color:var(--accent)}
.tap+em{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}
.copy{border:1px solid var(--line);background:transparent;border-radius:6px;font-size:12.5px;padding:2px 8px;color:var(--muted);text-decoration:none;font-family:var(--font)}
.copy:hover{color:var(--ink);border-color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap;border-radius:999px;padding:3px 10px;line-height:18px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.new{color:var(--new);background:var(--new-bg)} .st.work{color:var(--ok);background:var(--ok-bg)}
.st.reserve{color:var(--warn);background:var(--warn-bg)} .st.stop{color:var(--bad);background:var(--bad-bg)}
.stars{color:var(--warn);font-size:13px;white-space:nowrap;font-weight:500}
.r-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.row.sup{grid-template-columns:minmax(0,2.4fr) minmax(0,1.3fr) 90px 158px}
@media (max-width:900px){.row.sup{grid-template-columns:minmax(0,1fr) auto}.row.sup .r-city{text-align:right}table.mt{min-width:0}table.mt .hm{display:none}table.mt th,table.mt td{padding:9px 10px}}
/* ---------- supplier tab (layout of the former supplier registry: navy + orange) ---------- */
.sx-mode{--sx-navy:#122033;--sx-or:#e47717;--sx-or2:#c45f08;--sx-soft:#fff1e4;--sx-line:#e2e8f0;--sx-mut:#64748b}
.sx-mode .rail{padding:8px;border-radius:16px}
.sx-nav{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:12px;padding:12px;font-weight:600;font-size:14.5px;color:#475569;text-align:left}
.sx-nav:hover{background:#f8fafc}
.sx-nav[aria-current="true"]{background:var(--sx-soft);color:#a84d00}
.sx-i{flex:none}
.sx{display:flex;flex-direction:column;gap:22px;min-width:0}
.sx-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.sx-kick{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--sx-or2)}
.sx-head h1{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.01em;color:var(--sx-navy)}
.sx-note{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sx-mut)}
.sx-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sx-card,.sx-box{background:#fff;border:1px solid var(--sx-line);border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.sx-card{padding:20px}
.sx-card-t{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:14px;font-weight:600;color:var(--sx-mut)}
.sx-card-t .sx-i{color:var(--sx-or)}
.sx-big{margin:0;font-size:26px;font-weight:800;color:var(--sx-navy)}
.sx-small{margin:4px 0 0;font-size:12.5px;color:var(--sx-mut)}
.sx-filter{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;padding:16px}
.sx-search{position:relative;display:block}
.sx-search .sx-i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8}
.sx-search input,.sx-field{width:100%;height:44px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:12px;padding:0 12px;font-size:14px;outline:none}
.sx-search input{padding-left:40px}
.sx-field{font-weight:600}
.sx-search input:focus,.sx-field:focus{border-color:var(--sx-or)}
.sx-tbl{overflow:hidden}
.sx-scroll{overflow-x:auto}
.sx-table{width:100%;border-collapse:collapse;font-size:14px;min-width:0}
.sx-table.sx-wide{min-width:980px}
.sx-table th{background:#f8fafc;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--sx-mut);padding:14px 16px;border:0;white-space:nowrap}
.sx-table td{padding:16px;border-top:1px solid #f1f5f9;vertical-align:middle}
.sx-row{cursor:pointer}
.sx-row:hover{background:#fffaf5}
.sx-name{color:var(--sx-navy)}
.sx-sub{margin:4px 0 0;font-size:12.5px;color:var(--sx-mut);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sx-sub .tap{font-size:12.5px;color:var(--sx-mut)}
.sx-chip{display:inline-flex;margin-top:8px;border-radius:999px;background:#f1f5f9;padding:3px 9px;font-size:11.5px;font-weight:600;color:#475569}
.sx-chip.dark{background:var(--sx-navy);color:#fff;font-weight:700}
.sx-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sx-chips .sx-chip{margin-top:6px}
.sx-money{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.sx-raw{white-space:pre-line;font-size:13.5px}
.sx-muted{color:#475569}
.sx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sx-sup{padding:20px;cursor:pointer;text-align:left}
.sx-sup:hover{border-color:#fbd5b0}
.sx-sup h2{margin:0;font-size:16px;font-weight:800;color:var(--sx-navy)}
.sx-badge{width:40px;height:40px;border-radius:12px;background:var(--sx-soft);color:#b65300;display:grid;place-items:center;margin-bottom:16px}
.sx-ph{margin:10px 0 0;font-size:14px;color:#475569}
.sx-ph+.sx-ph{margin-top:4px}
.sx-empty{display:grid;place-items:center;text-align:center;gap:10px;padding:40px 24px;min-height:200px;color:var(--sx-mut);font-size:14px}
.sx-empty .sx-i{color:#cbd5e1}
.sx-empty p{margin:0}
.sx-empty b{display:block;color:var(--sx-navy);font-size:16px;margin-bottom:4px}
.sx-btn{border:0;border-radius:12px;background:var(--sx-or);color:#fff;font-weight:800;padding:10px 18px;min-height:42px}
.sx-btn:hover{background:#c9650d}
.sx-mode .bar .btn.primary{background:var(--sx-or);border-color:var(--sx-or);font-weight:700}
.sx-chart{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px;padding:20px}
.sx-lbl{display:block;margin:0 0 8px;font-size:14px;font-weight:700;color:#334155}
.sx-checks{max-height:310px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.sx-checks label{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;font-size:14px;cursor:pointer}
.sx-checks label:hover{background:#f8fafc}
.sx-checks i{width:10px;height:10px;border-radius:50%;flex:none}
.sx-chart h2,.sx-pad h2,.sx-log h2{margin:0;font-size:17px;font-weight:800;color:var(--sx-navy)}
.sx-plot{margin-top:18px;min-height:300px}
.sx-plot svg{width:100%;height:auto;display:block;font-size:12px;fill:#64748b}
.sx-pad{padding:20px}
.sx-bb{border-bottom:1px solid var(--sx-line)}
.sx-hrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.sx-hf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.sx-hist{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.sx-hl{max-height:650px;overflow:auto}
.sx-hi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 130px 130px;gap:8px;padding:16px;border-top:1px solid #f1f5f9;cursor:pointer;font-size:14px}
.sx-hi:first-child{border-top:0}
.sx-hi:hover{background:#fffaf5}
.sx-hi p{margin:0}
.sx-kick2{font-size:12px;font-weight:700;color:#b65300}
.sx-log{background:var(--sx-navy);color:#fff;border-radius:16px;padding:20px}
.sx-log>.sx-i{color:#f5a657;margin-bottom:14px}
.sx-log h2{color:#fff;margin-bottom:16px}
.sx-le{border:1px solid #475569;background:rgba(30,41,59,.6);border-radius:12px;padding:12px;margin-top:10px;font-size:13.5px}
.sx-le p{margin:4px 0;color:#cbd5e1;font-size:12.5px}
.sx-le small{color:#94a3b8;font-size:12px}
.sx-sm-only{display:none}
@media (max-width:1200px){.sx-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.sx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sx-hf{grid-template-columns:repeat(3,minmax(0,1fr))}.sx-hist{grid-template-columns:minmax(0,1fr)}.sx-chart{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .sx-mode .wrap{grid-template-columns:minmax(0,1fr)}
  .sx-mode .rail{display:flex!important;position:static;max-height:none;overflow-x:auto;gap:6px}
  .sx-nav{width:auto;flex:none;white-space:nowrap}
  .sx-filter{grid-template-columns:minmax(0,1fr)}
  .sx-grid{grid-template-columns:minmax(0,1fr)}
  .sx-hf{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sx-hi{grid-template-columns:minmax(0,1fr) auto}
  .sx-hm{display:none}.sx-sm-only{display:inline}
  .sx-head h1{font-size:24px}
}
@media (max-width:520px){.sx-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sx-card{padding:14px}.sx-big{font-size:20px}.sx-table td,.sx-table th{padding:12px 10px}}

/* ---------- rates ---------- */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap;font-family:var(--font);font-variant-numeric:tabular-nums}
tr.sec td{background:var(--raise);font-weight:500;font-size:13.5px;color:var(--muted)}
tr.sec .btn{float:right}
tbody tr.rr{cursor:pointer}
tbody tr.rr:hover{background:var(--raise)}
.cnt{color:var(--muted)}

/* ---------- panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,28,45,.35);z-index:20;display:flex;justify-content:flex-end}
.panel{width:min(560px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column}
.p-head{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;border-bottom:1px solid var(--line)}
.p-head h2{margin:0;font-size:18px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.p-body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.p-foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hint{font-size:13px;color:var(--muted);margin:0}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:14px}
.cat-g{display:flex;flex-direction:column;gap:6px}
.cat-g h4{margin:0;font-size:13px;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center}
.tog{position:relative}
.tog input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tog span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px}
.tog input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tog input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.rate-in{display:flex;gap:4px}
.rate-in button{border:1px solid var(--line);background:var(--surface);border-radius:7px;min-width:38px;min-height:38px;font-weight:600;color:var(--muted)}
.rate-in button.on{background:var(--soft);color:var(--ink);border-color:transparent}
.price-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 120px 32px;gap:6px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.price-row .pn{grid-column:1/-1;font-size:13.5px;min-height:56px}
.pw-cell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding-top:6px}
.pw-cell .inp{width:100%}
.pn-tog{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px}
.pw-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.ph{grid-column:1/-1;background:var(--raise);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.ph-i{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.ph-i.cur{color:var(--ink)}
.ph-i b{font-weight:500}
.sp-head,.sp-row{display:grid;grid-template-columns:minmax(0,1fr) 54px 104px 104px 28px;gap:6px;align-items:start}
.sp-head{font-size:12.5px;color:var(--muted);padding-top:4px}

<script>
(function(){
"use strict";
var STAGES=[{id:"s1",name:"Подготовка"},{id:"s2",name:"Нулевой цикл"},{id:"s3",name:"Кладка"},{id:"s8",name:"Кровля"},{id:"s4",name:"Инженерные сети"},{id:"s5",name:"Отделка"},{id:"s6",name:"Участок"},{id:"s7",name:"Контроль"}];
var DEFAULT_CATS=[
 {id:"geo",name:"Геодезия",stage:"s1"},
 {id:"bur",name:"Буровые и свайные работы",stage:"s2"},{id:"mono",name:"Монолитные работы",stage:"s2"},
 {id:"klad",name:"Кладка: несущие стены и перегородки",stage:"s3"},{id:"fasad",name:"Кладка: фасадная",stage:"s3"},{id:"krov",name:"Скатная кровля",stage:"s8"},{id:"krovflat",name:"Плоская кровля",stage:"s8"},
 {id:"el",name:"Электрика",stage:"s4"},{id:"voda",name:"Водоснабжение",stage:"s4"},{id:"kan",name:"Канализация",stage:"s4"},{id:"otop",name:"Отопление",stage:"s4"},{id:"kond",name:"Кондиционирование",stage:"s4"},{id:"vent",name:"Вентиляция",stage:"s4"},{id:"los",name:"ЛОС",stage:"s4"},
 {id:"shtuk",name:"Штукатурка и стяжка",stage:"s5"},{id:"otd",name:"Отделка и плитка",stage:"s5"},
 {id:"blag",name:"Благоустройство",stage:"s6"},{id:"bass",name:"Бассейны",stage:"s6"},{id:"bani",name:"Бани",stage:"s6"},
 {id:"nadzor",name:"Технадзор",stage:"s7"},{id:"lab",name:"Лаборатория",stage:"s7"}];
var STATUS={work:"Работаем",reserve:"Резерв",stop:"Не работать",new:"Не проверен"};
var FORMS=["","Самозанятый","ИП","ООО","Бригада без оформления"];
var VATS=["","Без НДС","С НДС"];

var S={aliases:{},notSame:{},rview:"ref",rexp:{},cmp:[],cmpCat:"",cmpQ:"",cmpCommon:false,open:{},tok:null,sha:null,data:null,dek:null,vault:null,cats:DEFAULT_CATS,list:[],rates:[],tab:"people",q:"",cat:"all",status:"all",city:"",sort:"name",sheet:null,loaded:false,ctx:null,sup:[],mats:[],prs:[],slog:[],mcats:[],supIx:{},matIx:{},sview:"sup",scat:"all",ssort:"name"};
var $=function(id){return document.getElementById(id)};
var te=new TextEncoder(),td=new TextDecoder();
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function b64(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function rnd(n){return crypto.getRandomValues(new Uint8Array(n))}
function newId(){return "c"+Array.from(rnd(8)).map(function(x){return (x%36).toString(36)}).join("")}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}

/* ---------- crypto: records are AES-GCM encrypted with a data key; the data key is wrapped by a key derived from login+password ---------- */
async function deriveKek(login,pass,saltB64,iter){
  var salt0=unb64(saltB64),lg=te.encode(login.trim().toLowerCase()),salt=new Uint8Array(salt0.length+lg.length);salt.set(salt0);salt.set(lg,salt0.length);
  var base=await crypto.subtle.importKey("raw",te.encode(pass.normalize("NFKC")),"PBKDF2",false,["deriveKey"]);

function importDek(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",true,["encrypt","decrypt"])}
async function seal(obj,key){var iv=rnd(12);var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key||S.dek,te.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function unseal(d,key){var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(d.iv)},key||S.dek,unb64(d.ct));return JSON.parse(td.decode(pt))}
async function makeVault(login,pass,dekRaw,extra){
  var salt=b64(rnd(16)),iter=210000,kek=await deriveKek(login,pass,salt,iter),iv=rnd(12);
  var wrapped=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},kek,dekRaw);
  var dek=await importDek(dekRaw),chk=await seal("ok",dek);
  return Object.assign({v:1,salt:salt,iter:iter,iv:b64(iv),wrapped:b64(wrapped),civ:chk.iv,cct:chk.ct},extra||{});
}
async function checkDek(dek,v){try{return (await unseal({iv:v.civ,ct:v.cct},dek))==="ok"}catch(e){return false}}

/* ---------- helpers ---------- */
function normPhone(s){var d=String(s).replace(/\D/g,"");if(d.length===11&&d[0]==="8")d="7"+d.slice(1);if(d.length===10)d="7"+d;return d}
function fmtPhone(d){return d.length===11&&d[0]==="7"?"+7 "+d.slice(1,4)+" "+d.slice(4,7)+"-"+d.slice(7,9)+"-"+d.slice(9):(d?"+"+d:"")}
function parsePhones(s){var m=String(s).match(/\+?\d[\d\s()\-]{8,}\d/g)||[];var out=[];m.forEach(function(x){var d=normPhone(x);if(d.length>=10&&out.indexOf(d)<0)out.push(d)});return out}
function norm(s){return String(s||"").toLowerCase().replace(/ё/g,"е")}
function catById(id){for(var i=0;i<S.cats.length;i++)if(S.cats[i].id===id)return S.cats[i];return null}
function toast(msg){var t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3200)}
function failMsg(e){return e&&e.code==="auth"?"Ключ доступа к хранилищу больше не действует. Его нужно выпустить заново":e&&e.code==="busy"?"Кто-то сохраняет одновременно с вами. Повторите через несколько секунд":"Не удалось сохранить. Проверьте интернет и попробуйте ещё раз"}
function stars(n){n=n||0;if(!n)return "";var s="";for(var i=1;i<=5;i++)s+=i<=n?"★":"<s>★</s>";return '<span class="stars" title="Оценка '+n+' из 5">'+s+"</span>"}

/* ---------- boot + auth ---------- */
/* ---------- storage: one encrypted file in a private GitHub repository; every save is a commit ---------- */
var API="https://api.github.com/repos/";
function gh(path,opt){opt=opt||{};opt.headers={Authorization:"Bearer "+S.tok,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};opt.cache="no-store";return fetch(API+path,opt)}
function normCats(list){
  var out=list.map(function(c){c=Object.assign({},c);if(c.id==="krov"){c.name="Скатная кровля";c.stage="s8"}if(c.id==="krovflat")c.stage="s8";return c});
  if(!out.some(function(c){return c.id==="krovflat"})){var i=out.findIndex(function(c){return c.id==="krov"});out.splice(i<0?out.length:i+1,0,{id:"krovflat",name:"Плоская кровля",stage:"s8"})}
  return out;
}
function apply(){
  var d=S.data;S.list=Object.keys(d.contractors||{}).map(function(id){return Object.assign({},d.contractors[id],{id:id})});
  S.rates=Object.keys(d.rates||{}).map(function(id){return Object.assign({},d.rates[id],{id:id})}).sort(function(a,b){return (a.order||0)-(b.order||0)});
  if(!S.sheet&&S.rates[0])S.sheet=S.rates[0].id;
  S.aliases=d.aliases&&typeof d.aliases==="object"?d.aliases:{};S.notSame=d.notSame&&typeof d.notSame==="object"?d.notSame:{};S.cats=normCats(d.cats&&d.cats.length?d.cats:DEFAULT_CATS);applySupply();S.loaded=true;render();
}
async function load(){
  var r=await gh(S.vault.data+"/contents/data.json?t="+Date.now());
  if(!r.ok)throw{code:r.status===401||r.status===403?"auth":"net"};
  var j=await r.json();if(j.sha===S.sha&&S.data)return;
  var d=await unseal(JSON.parse(atob(j.content.replace(/\s/g,""))));S.data=d;S.sha=j.sha;apply();
}
var chain=Promise.resolve();
function mutate(fn){
  var p=chain.then(async function(){
    for(var i=0;i<4;i++){
      await load();var d=JSON.parse(JSON.stringify(S.data));fn(d);var s=await seal(d);
      var r=await gh(S.vault.data+"/contents/data.json",{method:"PUT",body:JSON.stringify({message:"Изменение реестра",content:btoa(JSON.stringify(s)),sha:S.sha})});

      if(r.status!==409&&r.status!==422)throw{code:"net"};

    }

}
async function start(){S.tok=await unseal({iv:S.vault.tiv,ct:S.vault.tct});await load();enter()}
async function boot(){
  var r=null;try{r=await fetch("vault.json?t="+Date.now(),{cache:"no-store"})}catch(e){}
  if(r&&r.status===404){authView("setup");return}
  if(!r||!r.ok){authView("nodb");return}
  try{S.vault=await r.json()}catch(e){authView("nodb");return}
  var saved=ls("rp.dek");
  if(saved){try{var dek=await importDek(unb64(saved));if(await checkDek(dek,S.vault)){S.dek=dek;try{await start();return}catch(e){if(e&&e.code==="auth"){authView("rekey");return}S.dek=null;authView("login","Не удалось загрузить данные. Проверьте интернет и войдите ещё раз");return}}}catch(e){} ls("rp.dek",null)}
  authView("login");
}
function authView(mode,err){
  var h="";
  if(mode==="nodb"){h='<h1>Реестр недоступен</h1><p>Не удалось загрузить страницу входа. Проверьте интернет и обновите страницу.</p>'}

var STOP={"и":1,"в":1,"на":1,"с":1,"со":1,"из":1,"до":1,"по":1,"за":1,"для":1,"под":1,"от":1,"при":1,"без":1,"работ":1,"работы":1,"устройство":1,"монтаж":0};
function toks(w){var t=nkey(w).split(" "),out=[],nums=[];t.forEach(function(x){if(!x)return;if(/^\d/.test(x)){nums.push(x.replace(/[^\d.,]/g,""));return}if(STOP[x]===1||x.length<3)return;out.push(x.slice(0,5))});return{t:out,n:nums.sort().join(",")}}
function simScore(a,b){var A=toks(a),B=toks(b);if(A.n!==B.n)return 0;if(!A.t.length||!B.t.length)return 0;var inter=0;A.t.forEach(function(x){if(B.t.some(function(y){return y===x||(x.length>=3&&y.indexOf(x)===0)||(y.length>=3&&x.indexOf(y)===0)}))inter++});
  var uni=A.t.length+B.t.length-inter;return inter/uni}
function allWorks(){var m={};S.rates.forEach(function(sh){sh.sections.forEach(function(sec){sec.rows.forEach(function(r){var k=ck(r.work);if(!m[k])m[k]={name:canonName(r.work),ref:true,n:0}})})});
  S.list.forEach(function(c){(c.prices||[]).forEach(function(p){var k=ck(p.work);if(!k)return;if(!m[k])m[k]={name:canonName(p.work),ref:false,n:0};m[k].n++})});return m}
function findSimilar(){
  var m=allWorks(),keys=Object.keys(m),par={},sc={},hasRef={};keys.forEach(function(k){par[k]=k;hasRef[k]=m[k].ref});
  var f=function(x){while(par[x]!==x)x=par[x]=par[par[x]];return x};
  for(var i=0;i<keys.length;i++)for(var j=i+1;j<keys.length;j++){var a=keys[i],b=keys[j];if(m[a].ref&&m[b].ref)continue;if(!m[a].n&&!m[b].n)continue;if(S.notSame[a+"|"+b]||S.notSame[b+"|"+a])continue;
    var s=simScore(m[a].name,m[b].name);if(s>=0.6){var ra=f(a),rb=f(b);if(ra!==rb){if(hasRef[ra]&&hasRef[rb])continue;par[ra]=rb;hasRef[rb]=hasRef[rb]||hasRef[ra]}sc[a]=Math.max(sc[a]||0,s);sc[b]=Math.max(sc[b]||0,s)}}
  var g={};keys.forEach(function(k){var r=f(k);(g[r]=g[r]||[]).push(k)});
  return Object.keys(g).map(function(r){var ks=g[r];if(ks.length<2)return null;ks.sort(function(a,b){return (m[b].ref-m[a].ref)||(m[b].n-m[a].n)||m[a].name.length-m[b].name.length});
    var min=1;if(ks.length<=5){for(var x=0;x<ks.length;x++)for(var y=x+1;y<ks.length;y++)min=Math.min(min,simScore(m[ks[x]].name,m[ks[y]].name))}else min=0;
    return{items:ks.map(function(k){return{k:k,name:m[k].name,ref:m[k].ref,n:m[k].n}}),strong:min>=0.75}}).filter(Boolean).sort(function(a,b){return (b.strong-a.strong)}).slice(0,150);

  $("panel").innerHTML='<form id="pForm" style="display:contents" novalidate><div class="p-head"><h2>'+esc(title)+'</h2><button type="button" class="btn ghost" data-act="close" aria-label="Закрыть">Закрыть</button></div><div class="p-body">'+body+'</div><div class="p-foot">'+foot+"</div></form>";
  $("scrim").hidden=false;var f=$("panel").querySelector("input,textarea,select");if(f&&!ctx.nofocus)f.focus();
}
function closePanel(){$("scrim").hidden=true;$("panel").innerHTML="";S.ctx=null}

function todayISO(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}
function dRu(iso){return iso?new Date(iso+"T00:00:00").toLocaleDateString("ru-RU"):""}
function histHtml(p){var h=(p.hist||[]).slice(),rows=[],to=p.date||"";
  rows.push('<div class="ph-i cur"><b>'+esc(priceText(p))+'</b><span>'+(p.date?"с "+dRu(p.date):"действует сейчас")+"</span></div>");
  for(var i=h.length-1;i>=0;i--){var x=h[i];rows.push('<div class="ph-i"><span class="ph-p">'+esc(priceText(x))+'</span><span>'+(x.date?"с "+dRu(x.date):"")+(to?(x.date?" по ":"до ")+dRu(to):"")+"</span></div>");to=x.date||""}
  return rows.join("")}
function priceRowHtml(p){var w=p.work||"",n=p.note||"",hn=(p.hist||[]).length;return '<div class="price-row" data-key="'+esc(nkey(w))+'"><div class="pw-cell">'+(w?'<div class="pw-text">'+esc(w)+'</div><input type="hidden" name="pw" value="'+esc(w)+'">':'<input class="inp" name="pw" placeholder="Название работы">')+
  '<div class="pw-meta">'+(p.date?'<span>с '+esc(dRu(p.date))+"</span>":"")+(hn?'<button type="button" class="pn-tog" data-act="phist">история ('+hn+")</button>":"")+'<button type="button" class="pn-tog" data-act="pnote">'+(n?"Что входит ▾":"+ что входит")+'</button></div></div><input class="inp" name="pu" placeholder="ед." value="'+esc(p.unit||"")+'"><input class="inp" name="pp" placeholder="Цена" value="'+esc(p.price||"")+'"><button type="button" class="btn ghost" data-act="delprice" aria-label="Удалить расценку">×</button>'+
  '<textarea class="inp pn" name="pn" rows="2" placeholder="Что входит в работу, как работает, условия"'+(n?"":" hidden")+'>'+esc(n)+'</textarea>'+(hn?'<div class="ph" hidden>'+histHtml(p)+"</div>":"")+'</div>'}
function pickerHtml(){
  var have={};$("fPrices").querySelectorAll("[name=pw]").forEach(function(x){have[x.value]=1});
  if(!S.rates.length)return '<p class="hint">Разделов с расценками пока нет. Добавьте работу вручную кнопкой «Своя работа».</p>';
  return '<div class="picker">'+S.rates.map(function(sh){var n=0;sh.sections.forEach(function(x){n+=x.rows.length});
    return "<details><summary>"+esc(sh.title)+"<small>"+n+"</small></summary>"+sh.sections.map(function(sec){
      return "<details><summary>"+esc(sec.title)+"<small>"+sec.rows.length+"</small></summary>"+sec.rows.map(function(r){
        return '<button type="button" class="pk-item" data-act="pickwork" data-w="'+esc(r.work)+'"'+(have[r.work]?" disabled":"")+">"+esc(r.work)+(r.unit?"<small>"+esc(r.unit)+"</small>":"")+"</button>"}).join("")+"</details>"}).join("")+"</details>"}).join("")+"</div>";
}
function openContractor(id){
  var c=id?S.list.filter(function(x){return x.id===id})[0]:null;if(id&&!c)return;
  var d=c||{name:"",spec:"",cats:catById(S.cat)?[S.cat]:[],city:"",phones:[],form:"",vat:"",crew:"",rating:0,status:"new",objects:"",note:"",prices:[]};
  var cats=STAGES.map(function(st){var cs=S.cats.filter(function(k){return k.stage===st.id});if(!cs.length)return "";
    return '<div class="cat-g"><h4><i class="dot" style="background:var(--'+st.id+')"></i>'+esc(st.name)+'</h4><div class="chips">'+cs.map(function(k){return '<label class="tog"><input type="checkbox" name="cat" value="'+esc(k.id)+'"'+((d.cats||[]).indexOf(k.id)>=0?" checked":"")+"><span>"+esc(k.name)+"</span></label>"}).join("")+"</div></div>"}).join("");
  var cities=[];S.list.forEach(function(x){if(x.city&&cities.indexOf(x.city)<0)cities.push(x.city)});
  var links=(d.phones||[]).map(function(p){return '<div class="phone mono">'+fmtPhone(p)+' <button type="button" class="copy" data-act="copy" data-v="'+fmtPhone(p)+'">Копировать</button> <a class="copy" target="_blank" rel="noopener" href="https://wa.me/'+p+'">WhatsApp</a> <a class="copy" target="_blank" rel="noopener" href="https://t.me/+'+p+'">Telegram</a></div>'}).join("");
  var body=(links?'<div style="display:flex;flex-direction:column;gap:6px">'+links+"</div>":"")+
    '<label class="field"><span>Как записан</span><input class="inp" id="fName" required value="'+esc(d.name)+'" placeholder="Николай кровельщик"></label>'+
    '<div class="grid2"><label class="field"><span>Телефоны</span><input class="inp mono" id="fPhones" inputmode="tel" value="'+esc((d.phones||[]).map(fmtPhone).join(", "))+'" placeholder="+7 918 000-00-00"></label>'+
    '<label class="field"><span>Город или район</span><input class="inp" id="fCity" list="cityDl" value="'+esc(d.city||"")+'"><datalist id="cityDl">'+cities.map(function(x){return '<option value="'+esc(x)+'">'}).join("")+"</datalist></label></div>"+
    '<div class="grid2"><label class="field"><span>Статус</span><select class="inp" id="fStatus">'+Object.keys(STATUS).map(function(k){return '<option value="'+k+'"'+((d.status||"new")===k?" selected":"")+">"+STATUS[k]+"</option>"}).join("")+"</select></label>"+
    '<div class="field"><span>Оценка</span><div class="rate-in" id="fRating" data-v="'+(d.rating||0)+'">'+[1,2,3,4,5].map(function(n){return '<button type="button" data-act="rate" data-n="'+n+'" class="'+(n<=(d.rating||0)?"on":"")+'" aria-label="Оценка '+n+'">'+n+"</button>"}).join("")+"</div></div></div>"+
    '<div class="field"><span>Виды работ</span>'+cats+"</div>"+
    '<label class="field"><span>Специализация</span><input class="inp" id="fSpec" value="'+esc(d.spec||"")+'" placeholder="Например: фальц, автобур, бурение на воду"></label>'+
    '<div class="grid2"><label class="field"><span>Оформление</span><select class="inp" id="fForm">'+FORMS.map(function(f){return '<option value="'+f+'"'+((d.form||"")===f?" selected":"")+">"+(f||"Не указано")+"</option>"}).join("")+"</select></label>"+
    '<label class="field"><span>НДС</span><select class="inp" id="fVat">'+VATS.map(function(f){return '<option value="'+f+'"'+((d.vat||"")===f?" selected":"")+">"+(f||"Не указано")+"</option>"}).join("")+"</select></label></div>"+
    '<div class="grid2"><label class="field"><span>Бригада и техника</span><input class="inp" id="fCrew" value="'+esc(d.crew||"")+'" placeholder="4 человека, своя опалубка"></label>'+
    '<label class="field"><span>Наши объекты</span><input class="inp" id="fObjects" value="'+esc(d.objects||"")+'" placeholder="Где уже работал у нас"></label></div>'+
    '<label class="field"><span>Заметка</span><textarea class="inp" id="fNote" placeholder="Качество, сроки, как с ним работать">'+esc(d.note||"")+"</textarea></label>"+
    '<div class="field price-box"><span>Прайс подрядчика · <b id="fPriceCount">'+(d.prices||[]).length+'</b></span>'+
      '<div class="btnrow"><button type="button" class="btn small primary" data-act="xlpick">Загрузить из Excel</button><button type="button" class="btn small" data-act="pastebox">Вставить текстом</button><button type="button" class="btn small" data-act="pickprice">Выбрать из разделов</button><button type="button" class="btn small" data-act="addprice">Своя работа</button>'+(c&&(d.prices||[]).length?'<button type="button" class="btn small" data-act="cmpthis" data-id="'+esc(c.id)+'">Сравнить с другими</button>':"")+'</div>'+
      '<div id="fImport" class="imp-box" hidden></div><div id="fPicker" hidden></div>'+
      ((d.prices||[]).length?"":'<p class="hint">Прайса пока нет. Загрузите файл Excel, который прислал подрядчик, или вставьте прайс текстом.</p>')+
      (c&&(d.prices||[]).length?'<label class="pdate">Изменённые цены действуют с <input class="inp" type="date" id="fPDate" value="'+todayISO()+'"></label>':"")+
      '<div class="price-head" '+((d.prices||[]).length?"":"hidden")+'><span>Работа</span><span>Ед.</span><span>Цена</span><span></span></div><div id="fPrices" style="display:flex;flex-direction:column;gap:6px">'+(d.prices||[]).map(priceRowHtml).join("")+'</div></div>'+
    '<div id="fWarn"></div>';
  var foot=(c?'<button type="button" class="btn danger" data-act="del">Удалить</button>':"<span></span>")+'<button class="btn primary" id="pSave">Сохранить</button>';
  openPanel(c?c.name:"Новый подрядчик",body,foot,{nofocus:!!c,dupOk:false,delArmed:false,id:id,submit:async function(){
    var name=$("fName").value.trim();if(!name){$("fName").focus();return}
    var phones=parsePhones($("fPhones").value);
    var raw=$("fPhones").value.trim();
    if(raw&&!phones.length){$("fWarn").innerHTML='<div class="warnbox">Не удалось разобрать номер телефона. Проверьте его.</div>';return}
    if(!S.ctx.dupOk){var dup=S.list.filter(function(x){return x.id!==id&&(x.phones||[]).some(function(p){return phones.indexOf(p)>=0})});
      if(dup.length){S.ctx.dupOk=true;$("fWarn").innerHTML='<div class="warnbox">Такой номер уже есть у: '+esc(dup.map(function(x){return x.name}).join(", "))+". Нажмите «Сохранить» ещё раз, если это не ошибка.</div>";return}}
    var prev={};((c&&c.prices)||[]).forEach(function(q){prev[nkey(q.work)]=q});var nd=($("fPDate")&&$("fPDate").value)||todayISO(),changed=0;
    var prices=[];$("fPrices").querySelectorAll(".price-row").forEach(function(r){var w=r.querySelector('[name=pw]').value.trim(),p=r.querySelector('[name=pp]').value.trim(),u=r.querySelector('[name=pu]').value.trim(),nn=r.querySelector('[name=pn]').value.trim();if(w||p){var o={work:w,price:p};if(u)o.unit=u;if(nn)o.note=nn;
      var q=prev[nkey(w)];
      if(q){var same=String(q.price||"").replace(/\s/g,"")===p.replace(/\s/g,"")&&String(q.unit||"")===u;
        if(same){if(q.date)o.date=q.date;if(q.hist&&q.hist.length)o.hist=q.hist}
        else{o.date=nd;o.hist=(q.hist||[]).concat([{price:q.price||"",unit:q.unit||"",date:q.date||""}]).slice(-50);changed++}}
      else o.date=nd;
      prices.push(o)}});
    var o={name:name,spec:$("fSpec").value.trim(),cats:Array.from($("panel").querySelectorAll('[name=cat]:checked')).map(function(x){return x.value}),city:$("fCity").value.trim(),phones:phones,
      form:$("fForm").value,vat:$("fVat").value,crew:$("fCrew").value.trim(),rating:+$("fRating").dataset.v||0,status:$("fStatus").value,objects:$("fObjects").value.trim(),note:$("fNote").value.trim(),prices:prices,
      created:(c&&c.created)||Date.now(),updated:Date.now()};
    $("pSave").disabled=true;
    try{await putContractor(id||newId(),o);closePanel();toast("Сохранено")}catch(e){$("pSave").disabled=false;toast(failMsg(e))}
  }});
}
function putContractor(id,o){var copy=Object.assign({},o);delete copy.id;return mutate(function(d){d.contractors[id]=copy})}

function openFileImport(list){
  var have={},haveId={};S.list.forEach(function(x){(x.phones||[]).forEach(function(p){have[p]=x.name;haveId[p]=x.id})});
  var str=function(v,n){return String(v==null?"":v).slice(0,n||2000)};
  var items=list.filter(function(x){return x&&typeof x==="object"}).map(function(x){
    var phones=(Array.isArray(x.phones)?x.phones:[]).map(normPhone).filter(function(p){return p.length===11});
    return {name:str(x.name,200).trim()||"Без имени",spec:str(x.spec,300),cats:(Array.isArray(x.cats)?x.cats:[]).filter(catById),city:str(x.city,120),phones:phones,
      form:FORMS.indexOf(x.form)>=0?x.form:"",vat:VATS.indexOf(x.vat)>=0?x.vat:"",crew:str(x.crew,600),rating:Math.max(0,Math.min(5,+x.rating||0)),
      status:STATUS[x.status]?x.status:"new",objects:str(x.objects,600),note:str(x.note,2000),
      prices:(Array.isArray(x.prices)?x.prices:[]).slice(0,80).map(function(q){return {work:str(q&&q.work,400),price:str(q&&q.price,120)}}),
      dup:phones.map(function(p){return have[p]}).filter(Boolean)[0]||"",dupId:phones.map(function(p){return haveId[p]}).filter(Boolean)[0]||""}});
  var add=items.filter(function(it){return !it.dup}),merge=items.filter(function(it){return it.dup});
  openPanel("Загрузка из файла",'<p class="hint">Если номер уже есть в реестре, новый подрядчик не создаётся: к существующей карточке добавятся виды работ, расценки и заметка.</p><div class="field"><span>Новых: '+add.length+(merge.length?", дополнить: "+merge.length:"")+"</span>"+
    items.map(function(it){var k=it.cats.map(catById).filter(Boolean);return '<div class="quote"><span>'+esc(it.name)+(it.dup?' <span class="r-sub">номер уже есть у «'+esc(it.dup)+'», дополню его карточку'+(it.prices.length?" (расценок: "+it.prices.length+")":"")+"</span>":' <span class="r-sub">'+esc(k.map(function(z){return z.name}).join(", "))+(it.prices.length?" · расценок: "+it.prices.length:"")+"</span>")+'</span><span>'+it.phones.map(fmtPhone).join(", ")+"</span></div>"}).join("")+"</div>",
    '<span></span><button class="btn primary" id="pSave"'+(add.length+merge.length?"":" disabled")+'>'+(merge.length?"Сохранить":"Добавить "+add.length)+"</button>",
    {nofocus:true,submit:async function(){$("pSave").disabled=true;var now=Date.now();
      try{await mutate(function(d){add.forEach(function(it,i){var o=Object.assign({},it);delete o.dup;delete o.dupId;o.created=now;o.updated=now+i;d.contractors[newId()]=o});
        merge.forEach(function(it){var ex=d.contractors[it.dupId];if(!ex)return;ex.cats=ex.cats||[];it.cats.forEach(function(k){if(ex.cats.indexOf(k)<0)ex.cats.push(k)});
          ex.prices=ex.prices||[];var w={};ex.prices.forEach(function(q){w[q.work]=1});it.prices.forEach(function(q){if(!w[q.work])ex.prices.push(q)});
          if(it.note&&String(ex.note||"").indexOf(it.note)<0)ex.note=(ex.note?ex.note+"\n":"")+it.note;if(!ex.spec&&it.spec)ex.spec=it.spec;if(!ex.city&&it.city)ex.city=it.city;ex.updated=now})});
        closePanel();toast("Добавлено: "+add.length+(merge.length?", дополнено: "+merge.length:""))}
      catch(e){$("pSave").disabled=false;toast(failMsg(e))}}});
}
function openImport(){
  var opts='<option value="">Не указывать</option>'+S.cats.map(function(k){return '<option value="'+esc(k.id)+'"'+(S.cat===k.id?" selected":"")+">"+esc(k.name)+"</option>"}).join("");
  openPanel("Вставить списком",
    '<p class="hint">Вставьте контакты как есть, по одному на строку или через запятую. Нужны только имя и номер, например: «Николай кровельщик 8 918 451-67-41».</p>'+
    '<label class="field"><span>Список</span><textarea class="inp" id="iText" style="min-height:220px"></textarea></label>'+
    '<label class="field"><span>Вид работ для всех</span><select class="inp" id="iCat">'+opts+"</select></label>"+
    '<div id="iPrev"></div>',
    '<span></span><button class="btn primary" id="pSave">Проверить список</button>',
    {stage:0,items:[],submit:async function(){
      var ctx=S.ctx;
      if(ctx.stage===0){
        var text=$("iText").value,items=[],re=/\+?\d[\d\s()\-]{8,}\d/g,m,last=0,parts=[];
        while((m=re.exec(text))){parts.push({before:text.slice(last,m.index),phone:m[0]});last=re.lastIndex}
        var tail=text.slice(last);
        parts.forEach(function(p,i){var nameB=p.before.replace(/[\n,;]+/g," ").replace(/^[\s\-–—:.]+|[\s\-–—:.]+$/g,"").trim();
          var d=normPhone(p.phone);
          if(!nameB&&items.length&&d.length>=10){items[items.length-1].phones.push(d);return}
          if(!nameB){var after=(parts[i+1]?parts[i+1].before:tail).split(/[\n,;]/)[0].replace(/^[\s\-–—:.]+|[\s\-–—:.]+$/g,"").trim();nameB=after;if(parts[i+1])parts[i+1].before=parts[i+1].before.replace(after,"");}
          items.push({name:nameB||"Без имени",phones:[d]})});
        if(!items.length){$("iPrev").innerHTML='<div class="warnbox">Не нашла ни одного номера телефона.</div>';return}
        var have={};S.list.forEach(function(x){(x.phones||[]).forEach(function(p){have[p]=x.name})});
        items.forEach(function(it){it.dup=it.phones.map(function(p){return have[p]}).filter(Boolean)[0]||""});
        ctx.items=items.filter(function(it){return !it.dup});ctx.stage=1;
        $("iPrev").innerHTML='<div class="field"><span>Будет добавлено: '+ctx.items.length+"</span>"+items.map(function(it){return '<div class="quote"><span>'+esc(it.name)+(it.dup?' <span class="r-sub">уже есть: '+esc(it.dup)+", пропущу</span>":"")+'</span><span class="mono">'+it.phones.map(fmtPhone).join(", ")+"</span></div>"}).join("")+"</div>";
        $("pSave").textContent="Добавить "+ctx.items.length;$("pSave").disabled=!ctx.items.length;return}
      $("pSave").disabled=true;var cat=$("iCat").value,n=0;
      try{await mutate(function(d){ctx.items.forEach(function(it){d.contractors[newId()]={name:it.name,spec:"",cats:cat?[cat]:[],city:"",phones:it.phones,form:"",vat:"",crew:"",rating:0,status:"new",objects:"",note:"",prices:[],created:Date.now(),updated:Date.now()};n++})});
        closePanel();toast("Добавлено: "+ctx.items.length)}catch(e){toast(failMsg(e));$("pSave").disabled=false}
    }});
}

function openRateRow(si,ri){
  var sh=S.rates.filter(function(x){return x.id===S.sheet})[0]||S.rates[0];if(!sh)return;
  var sec=sh.sections[si],r=ri>=0?sec.rows[ri]:{work:"",unit:"",p:[]},qs=ri>=0?quotesFor(r.work):[];
  var body='<label class="field"><span>Работа</span><textarea class="inp" id="rWork" required>'+esc(r.work)+"</textarea></label>"+
    '<div class="grid2"><label class="field"><span>Ед. изм.</span><input class="inp" id="rUnit" value="'+esc(r.unit||"")+'"></label>'+sh.cols.map(function(c,ci){var v=(r.p||[])[ci];return '<label class="field"><span>'+esc(c)+'</span><input class="inp mono" name="rp" value="'+esc(v==null?"":v)+'"></label>'}).join("")+"</div>"+
    (ri>=0?'<div class="field"><span>Предложения подрядчиков</span>'+(qs.length?qs.map(function(q){return '<div class="quote"><button type="button" class="linkish" data-act="open" data-id="'+esc(q.c.id)+'">'+esc(q.c.name)+'</button><span>'+esc(priceText(q.p))+"</span></div>"}).join(""):'<p class="hint">Пока никто не давал цену на эту работу. Цену подрядчика можно внести в его карточке, в блоке «Расценки подрядчика».</p>')+"</div>":"");
  openPanel(ri>=0?"Строка расценок":"Новая строка: "+sec.title,body,(ri>=0?'<button type="button" class="btn danger" data-act="del">Удалить</button>':"<span></span>")+'<button class="btn primary" id="pSave">Сохранить</button>',
   {nofocus:ri>=0,delArmed:false,rate:{si:si,ri:ri},submit:async function(){
     var w=$("rWork").value.trim();if(!w){$("rWork").focus();return}
     var nr={work:w,unit:$("rUnit").value.trim(),p:Array.from($("panel").querySelectorAll('[name=rp]')).map(function(x){return x.value.trim()})};
     var copy=JSON.parse(JSON.stringify(sh));if(ri>=0)copy.sections[si].rows[ri]=nr;else copy.sections[si].rows.push(nr);
     $("pSave").disabled=true;
     try{await putSheet(copy);
       if(ri>=0&&r.work!==w){for(var i=0;i<qs.length;i++){var c=JSON.parse(JSON.stringify(qs[i].c));c.prices.forEach(function(p){if(p.work===r.work)p.work=w});c.updated=Date.now();await putContractor(c.id,c)}}
       closePanel();toast("Сохранено")}catch(e){$("pSave").disabled=false;toast(failMsg(e))}
   }});
}
function putSheet(sh){var id=sh.id,copy=Object.assign({},sh);delete copy.id;return mutate(function(d){d.rates[id]=copy})}

function openAddCat(){
  openPanel("Новый вид работ",'<label class="field"><span>Название</span><input class="inp" id="cName" required placeholder="Например: Окна и двери"></label><label class="field"><span>Этап стройки</span><select class="inp" id="cStage">'+STAGES.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+"</option>"}).join("")+"</select></label>",
   '<span></span><button class="btn primary" id="pSave">Добавить</button>',{submit:async function(){
     var n=$("cName").value.trim();if(!n){$("cName").focus();return}
     if(S.cats.some(function(c){return norm(c.name)===norm(n)})){toast("Такой вид работ уже есть");return}
     var cats=S.cats.concat([{id:"k"+Date.now().toString(36),name:n,stage:$("cStage").value}]);
     $("pSave").disabled=true;
     try{await mutate(function(d){d.cats=cats});closePanel();toast("Вид работ добавлен")}catch(e){$("pSave").disabled=false;toast(failMsg(e))}
   }});

var PDFJS="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve();return new Promise(function(ok,no){var sc=document.createElement("script");sc.src=PDFJS;sc.onload=function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS.replace("pdf.min.js","pdf.worker.min.js");ok()};sc.onerror=no;document.head.appendChild(sc)})}
function pdfText(file){return loadPdfJs().then(function(){return file.arrayBuffer()}).then(function(buf){return window.pdfjsLib.getDocument({data:buf}).promise}).then(function(doc){
  var pages=[];for(var i=1;i<=doc.numPages;i++)pages.push(doc.getPage(i).then(function(pg){return pg.getTextContent()}));
  return Promise.all(pages).then(function(cs){return cs.map(function(c){var lines={};c.items.forEach(function(it){var y=Math.round(it.transform[5]/3);(lines[y]=lines[y]||[]).push(it)});
    return Object.keys(lines).sort(function(a,b){return b-a}).map(function(y){return lines[y].sort(function(a,b){return a.transform[4]-b.transform[4]}).map(function(it){return it.str.trim()}).filter(Boolean).join("   ").trim()}).filter(Boolean).join("\n")}).join("\n")})})}

function readSupExcel(file){
  var box=$("spImport");box.hidden=false;box.innerHTML='<p class="hint">Читаю файл…</p>';
  loadXLSX().then(function(){return file.arrayBuffer()}).then(function(buf){var wb=XLSX.read(buf,{type:"array"});
    var names=wb.SheetNames.filter(function(n){var ws=wb.Sheets[n];return ws&&ws["!ref"]});
    S.ctx.sxl={wb:wb,sheets:names.length?names:wb.SheetNames,si:0,sec:false};spPickSheet(0)})
  .catch(function(){box.innerHTML='<div class="warnbox">Не удалось прочитать файл. Подходят таблицы Excel (.xlsx, .xls) и .csv.</div>'});

function spPickSheet(i){var I=S.ctx.sxl,ws=I.wb.Sheets[I.sheets[i]];I.si=i;
  I.rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""}).map(function(r){return r.map(function(x){return String(x)})});
  var g=guessCols(I.rows);g.vat=-1;
  var st0=g.start,vs=-1;
  for(var hr=Math.max(0,st0-3);hr<st0+3&&hr<I.rows.length;hr++){var rw=I.rows[hr]||[],hit=false;
    if(rw.some(function(x){return /\d{3,}/.test(String(x).replace(/\s/g,""))&&!/%/.test(x)}))continue;
    rw.forEach(function(x,j){x=norm(x);if(j===g.work||j===g.unit)return;
      var sc=/с ндс|ндс\s*2\d|2[02]\s*%/.test(x)?3:/ндс/.test(x)&&!/без ндс/.test(x)?2:/безнал|б\/н/.test(x)?1:0;
      if(sc>vs&&sc>0){vs=sc;g.vat=j;hit=true}else if(/^нал|налич|без ндс/.test(x)){g.price=j;hit=true}});
    if(hit&&hr>=g.start)g.start=hr+1}
  if(g.vat===g.price)g.vat=-1;I.g=g;$("spImport").innerHTML=spSheetUI()}

function sxPlot(ps,avail){

  var g="";for(var i=0;i<=4;i++){var vv=v0+(v1-v0)*i/4,y=Y(vv);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#e2e8f0" stroke-dasharray="3 3"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(vv).toLocaleString("ru-RU")+"</text>"}
  var ds={};all.forEach(function(p){ds[p.d]=p.t});Object.keys(ds).sort().forEach(function(d,k,arr){if(arr.length>8&&k%Math.ceil(arr.length/8))return;g+='<text x="'+X(ds[d])+'" y="'+(H-Bt+20)+'" text-anchor="middle">'+new Date(ds[d]).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit"})+"</text>"});
  series.forEach(function(s){g+='<polyline fill="none" stroke="'+s.c+'" stroke-width="3" stroke-linejoin="round" points="'+s.pts.map(function(p){return X(p.t)+","+Y(p.v)}).join(" ")+'"/>';

  return '<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Изменение цены во времени">'+g+"</svg>";
}

  if(ev.target.closest("[data-stop]")){ev.stopPropagation();return}
  if(!el){if(!menu.hidden)menu.hidden=true;if(ev.target===$("scrim"))closePanel();return}
  var a=el.dataset.act;
  if(a!=="menu")menu.hidden=true;
  if(a==="menu"){menu.hidden=!menu.hidden}
  else if(a==="tab"){S.tab=el.dataset.tab;render()}
  else if(a==="cat"){S.cat=el.dataset.cat;var ck=catById(S.cat);if(ck)S.open[ck.stage]=true;render()}
  else if(a==="stage"){var sg=el.dataset.stage;if(S.open[sg]&&S.cat==="st:"+sg){S.open[sg]=false;S.cat="all"}else{S.open[sg]=true;S.cat="st:"+sg}render()}
  else if(a==="status"){S.status=el.dataset.status;render()}
  else if(a==="sheet"){S.sheet=el.dataset.id;render()}
  else if(a==="copy"){ev.stopPropagation();var v=el.dataset.v;try{await navigator.clipboard.writeText(v);toast("Скопировано: "+v)}catch(e){toast("Номер: "+v)}}
  else if(a==="open"){openContractor(el.dataset.id)}
  else if(a==="add"){openContractor(null)}
  else if(a==="import"){openImport()}
  else if(a==="addcat"){openAddCat()}
  else if(a==="importfile"){var fi=$("importFile");fi.value="";fi.click()}
  else if(a==="passwd"){openPasswd()}
  else if(a==="export"){if(S.tab==="supply")exportSupplyCsv();else exportCsv()}
  else if(a==="genpass"){var al="abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789",o="",rv=rnd(20);for(var gi=0;gi<20;gi++)o+=al[rv[gi]%al.length];$("password").value=o.replace(/(.{5})(?=.)/g,"$1-")}
  else if(a==="logout"){ls("rp.dek",null);location.reload()}
  else if(a==="close"){closePanel()}
  else if(a==="rate"){var box=$("fRating"),n=+el.dataset.n;if(+box.dataset.v===n)n=0;box.dataset.v=n;box.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",+b.dataset.n<=n)})}
  else if(a==="delprice"){el.closest(".price-row").remove();priceHead();if(!$("fPicker").hidden)$("fPicker").innerHTML=pickerHtml()}
  else if(a==="pickprice"){var pk=$("fPicker");pk.hidden=!pk.hidden;if(!pk.hidden){pk.innerHTML=pickerHtml();pk.scrollIntoView({block:"nearest"})}}
  else if(a==="pickwork"){$("fPrices").insertAdjacentHTML("beforeend",priceRowHtml({work:el.dataset.w}));el.disabled=true;priceHead();var pi=$("fPrices").querySelectorAll('[name=pp]');pi[pi.length-1].focus()}
  else if(a==="scat"){S.scat=el.dataset.cat;render()}
  else if(a==="sview"){S.sview=el.dataset.v;S.scat="all";render()}
  else if(a==="sopen"){ev.stopPropagation();openSupplier(el.dataset.id)}
  else if(a==="mopen"){openMaterial(el.dataset.id)}
  else if(a==="addsup"){openSupplier(null)}
  else if(a==="addmat"){openMaterial(null,el.dataset.cat)}
  else if(a==="addprice"){if(el.closest("#panel")&&!el.closest("#fPrices")&&(el.dataset.sup||el.dataset.mat)){openPrice({sup:el.dataset.sup,mat:el.dataset.mat})}else if(!el.closest("#panel")){openPrice({})}else{$("fPrices").insertAdjacentHTML("beforeend",priceRowHtml({}));priceHead();var ins0=$("fPrices").querySelectorAll('[name=pw]');ins0[ins0.length-1].focus()}}
  else if(a==="spdel"){ev.stopPropagation();if(el.dataset.armed!=="1"){el.dataset.armed="1";el.textContent="Удалить?";return}el.disabled=true;var back=S.ctx;try{await delPrice(el.dataset.id);toast("Цена удалена");if(back&&back.reopen)back.reopen();else el.closest(".quote").remove()}catch(e){el.disabled=false;toast(failMsg(e))}}
  else if(a==="slog"){openSupplyLog()}
  else if(a==="sxview"){S.sx=el.dataset.v;render();window.scrollTo(0,0)}
  else if(a==="sxreset"){S.hf=null;renderSxBody()}
  else if(a==="raterow"){ev.stopPropagation();openRateRow(+el.dataset.s,+el.dataset.r)}
  else if(a==="sxl"){var sf=$("sxlFile");sf.value="";sf.click()}
  else if(a==="spdf"){var pf=$("spdfFile");pf.value="";pf.click()}
  else if(a==="spaste"){openSupPaste("")}
  else if(a==="spparse"){var sl=spTextRows($("spText").value);$("spRes").innerHTML=sl.length?spPreview(sl):'<div class="warnbox">Не нашла строк с ценами. Цена должна стоять в конце строки, например «Щебень 5-20 1800 р/т».</div>'}
  else if(a==="spchk"){var si2=S.ctx.simp[+el.dataset.i];si2.on=el.checked;el.closest(".imp-row").classList.toggle("off",!si2.on);var sb=$("panel").querySelector("[data-act=spdo]");if(sb)sb.textContent="Добавить в прайс: "+S.ctx.simp.filter(function(x){return x.on}).length;return}
  else if(a==="spdo"){spApply()}
  else if(a==="spcancel"){$("spImport").hidden=true;$("spImport").innerHTML="";S.ctx.simp=null}
  else if(a==="spdrop"){el.closest(".sp-row").remove();$("spCount").textContent=$("spRows").children.length}
  else if(a==="sphist"){var shb=el.closest(".sp-row").querySelector(".ph");shb.hidden=!shb.hidden}
  else if(a==="spnote"){var sta=el.closest(".sp-row").querySelector("[name=snote]");sta.hidden=!sta.hidden;if(!sta.hidden)sta.focus()}
  else if(a==="spsec"){S.ctx.sxl.sec=el.checked;$("spImport").innerHTML=spSheetUI();return}
  else if(a==="phist"){var hb=el.closest(".price-row").querySelector(".ph");hb.hidden=!hb.hidden}
  else if(a==="pnote"){var pr=el.closest(".price-row"),ta=pr.querySelector("[name=pn]");ta.hidden=!ta.hidden;el.textContent=ta.hidden?(ta.value.trim()?"Что входит ▸":"+ что входит"):"Что входит ▾";if(!ta.hidden)ta.focus()}
  else if(a==="mergechk"){var cnt=$("main").querySelectorAll("[data-act=mergechk]:checked").length;$("mergeBar").hidden=cnt<2;$("mergeCnt").textContent="Выбрано строк: "+cnt;return}
  else if(a==="mergeclear"){$("main").querySelectorAll("[data-act=mergechk]:checked").forEach(function(x){x.checked=false});$("mergeBar").hidden=true}
  else if(a==="mergesel"){var ks=Array.from($("main").querySelectorAll("[data-act=mergechk]:checked")).map(function(x){return x.dataset.k});openMergeDialog(ks)}
  else if(a==="mergedo"){var mi=+($("panel").querySelector("[name=mmain]:checked")||{}).value,nm=S.ctx.mnames,main=nm[mi];el.disabled=true;
    try{await mergeNames([{main:main,others:nm.filter(function(x,i){return i!==mi})}]);closePanel();toast("Объединено в «"+main+"»")}catch(e){el.disabled=false;toast(failMsg(e))}}
  else if(a==="samedo"){var gs=[];$("main").querySelectorAll(".same-on input:checked").forEach(function(x){var gi=+x.dataset.g,g=S.sameGroups[gi],r=+$("main").querySelector("[name=sg"+gi+"]:checked").value;
      gs.push({main:g.items[r].name,others:g.items.filter(function(it,i){return i!==r}).map(function(it){return it.name})})});
    if(!gs.length){toast("Отметьте хотя бы одну группу");return}el.disabled=true;
    try{await mergeNames(gs);toast("Объединено групп: "+gs.length)}catch(e){el.disabled=false;toast(failMsg(e))}}
  else if(a==="samediff"){var g2=S.sameGroups[+el.dataset.g];el.disabled=true;
    try{await mutate(function(d){var ns=d.notSame&&typeof d.notSame==="object"?d.notSame:{};g2.items.forEach(function(x){g2.items.forEach(function(y){if(x.k<y.k)ns[x.k+"|"+y.k]=1})});d.notSame=ns});toast("Больше не буду предлагать")}catch(e){el.disabled=false;toast(failMsg(e))}}
  else if(a==="unmerge"){var tg=el.dataset.t;el.disabled=true;
    try{await mutate(function(d){var al2=d.aliases||{};Object.keys(al2).forEach(function(k){if(al2[k]===tg)delete al2[k]});d.aliases=al2});toast("Разъединено")}catch(e){el.disabled=false;toast(failMsg(e))}}
  else if(a==="rexp"){var rk=el.dataset.k;S.rexp[rk]=!S.rexp[rk];render()}
  else if(a==="rview"){S.rview=el.dataset.v;render()}
  else if(a==="cmpdel"){S.cmp=S.cmp.filter(function(x){return x!==el.dataset.id});ls("rp.cmp",JSON.stringify(S.cmp));render()}
  else if(a==="cmpthis"){if(S.cmp.indexOf(el.dataset.id)<0)S.cmp.push(el.dataset.id);ls("rp.cmp",JSON.stringify(S.cmp));closePanel();S.tab="rates";S.rview="cmp";render();window.scrollTo(0,0)}
  else if(a==="xlpick"){var xf=$("xlFile");xf.value="";xf.click()}
  else if(a==="pastebox"){openPasteBox()}
  else if(a==="impparse"){var lst=parsePriceText($("impText").value);$("impRes").innerHTML=lst.length?impPreview(lst):'<div class="warnbox">Не нашла строк с ценами. Цена должна стоять в конце строки, например «Стяжка 350 р/м.п».</div>'}
  else if(a==="impchk"){var it=S.ctx.imp[+el.dataset.i];it.on=el.checked;el.closest(".imp-row").classList.toggle("off",!it.on);var bt=$("panel").querySelector('[data-act=impdo]');if(bt)bt.textContent="Добавить в прайс: "+S.ctx.imp.filter(function(x){return x.on}).length;return}
  else if(a==="impdo"){impApply()}
  else if(a==="impcancel"){$("fImport").hidden=true;$("fImport").innerHTML="";S.ctx.imp=null}
  else if(a==="xlsec"){S.ctx.xl.sec=el.checked;$("fImport").innerHTML=sheetUI();return}
  else if(a==="del"){
    if(!S.ctx)return;
    if(!S.ctx.delArmed){S.ctx.delArmed=true;el.textContent="Точно удалить?";return}
    el.disabled=true;
    try{
      if(S.ctx.rate){var sh=JSON.parse(JSON.stringify(S.rates.filter(function(x){return x.id===S.sheet})[0]||S.rates[0]));sh.sections[S.ctx.rate.si].rows.splice(S.ctx.rate.ri,1);await putSheet(sh)}
      else if(S.ctx.sdel){await S.ctx.sdel()}
      else if(S.ctx.id){var did=S.ctx.id;await mutate(function(d){delete d.contractors[did]})}
      closePanel();toast("Удалено")}catch(e){el.disabled=false;toast(failMsg(e))}
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&!$("scrim").hidden)closePanel();
  if(ev.key==="Enter"&&ev.target.classList&&ev.target.classList.contains("row")){if(ev.target.dataset.act==="sopen")openSupplier(ev.target.dataset.id);else openContractor(ev.target.dataset.id)}
});
document.addEventListener("input",function(ev){
  var sdi=ev.target.dataset&&ev.target.dataset.simp;if(sdi&&S.ctx&&S.ctx.simp){S.ctx.simp[+ev.target.dataset.i][sdi]=ev.target.value;return}
  var di=ev.target.dataset&&ev.target.dataset.imp;if(di&&S.ctx&&S.ctx.imp){S.ctx.imp[+ev.target.dataset.i][di]=ev.target.value;return}
  if(ev.target.id==="cmpQ"){S.cmpQ=ev.target.value;var pos=ev.target.selectionStart;render();var ne=$("cmpQ");if(ne){ne.focus();try{ne.setSelectionRange(pos,pos)}catch(e){}}return}
  if(ev.target.id==="q"){S.q=ev.target.value;if(S.tab==="rates")S.tab="people";render()}else if(ev.target.id==="sxq"){S.sxq=ev.target.value;renderSxBody()}});
document.addEventListener("change",function(ev){var t=ev.target;
  if(t.id==="importFile"&&t.files&&t.files[0]){var rd=new FileReader();rd.onload=function(){try{var j=JSON.parse(rd.result);if(j&&!Array.isArray(j)&&(Array.isArray(j.suppliers)||Array.isArray(j.materials))){openSupplyImport(j);return}var l=Array.isArray(j)?j:j.contractors;if(!Array.isArray(l))throw 0;openFileImport(l)}catch(e){toast("Не удалось прочитать файл. Нужен файл .json, подготовленный для реестра")}};rd.readAsText(t.files[0]);return}
  if(t.id==="xlFile"&&t.files&&t.files[0]){readExcel(t.files[0]);return}
  if(t.id==="sxlFile"&&t.files&&t.files[0]){readSupExcel(t.files[0]);return}
  if(t.id==="spdfFile"&&t.files&&t.files[0]){var bx=$("spImport");bx.hidden=false;bx.innerHTML='<p class="hint">Читаю PDF…</p>';pdfText(t.files[0]).then(function(tx){openSupPaste(tx);if(!$("spRes").innerHTML.trim()||!S.ctx.simp||!S.ctx.simp.length)$("spRes").innerHTML='<div class="warnbox">В PDF не нашлось строк с ценой в конце. Если это таблица с несколькими колонками цен, попросите у поставщика тот же прайс в Excel.</div>'}).catch(function(){bx.innerHTML='<div class="warnbox">Не удалось прочитать PDF. Если это скан или фото, вставьте текст вручную или попросите прайс в Excel.</div>'});return}
  if(t.dataset&&t.dataset.act==="spcol"){S.ctx.sxl.g[t.dataset.key]=+t.value;$("spImport").innerHTML=spSheetUI();return}
  if(t.dataset&&t.dataset.act==="spsheet"){spPickSheet(+t.value);return}
  if(t.dataset&&t.dataset.act==="xlcol"){S.ctx.xl.g[t.dataset.key]=+t.value;$("fImport").innerHTML=sheetUI();return}
  if(t.dataset&&t.dataset.act==="xlsheet"){xlPickSheet(+t.value);return}
  if(t.id==="cmpAdd"&&t.value){S.cmp.push(t.value);ls("rp.cmp",JSON.stringify(S.cmp));render();return}
  if(t.id==="cmpCat"){S.cmpCat=t.value;render();return}
  if(t.id==="cmpCommon"){S.cmpCommon=t.checked;render();return}
  if(t.id==="catSel"){S.cat=t.value;var ck2=catById(S.cat);if(ck2)S.open[ck2.stage]=true;else if(S.cat.indexOf("st:")===0)S.open[S.cat.slice(3)]=true;render()}else if(t.id==="citySel"){S.city=t.value;render()}else if(t.id==="sortSel"){S.sort=t.value;render()}else if(t.id==="scatSel"){S.scat=t.value;render()}else if(t.id==="ssortSel"){S.ssort=t.value;render()}else if(t.id==="qMat"){$("qNew").hidden=t.value!=="new"}else if(t.id==="sxCat"){S.sxcat=t.value;renderSxBody()}else if(t.id==="chMat"){S.chMat=t.value;renderSxBody()}else if(t.name==="chSup"){S.chSel=Array.from(document.querySelectorAll("[name=chSup]:checked")).map(function(x){return x.value});renderSxBody()}else if(t.dataset&&t.dataset.hf){S.hf=S.hf||{};S.hf[t.dataset.hf]=t.value;if(t.dataset.hf==="c")S.hf.mat="";renderSxBody()}});

try{var cm=JSON.parse(ls("rp.cmp")||"[]");if(Array.isArray(cm))S.cmp=cm.filter(function(x){return typeof x==="string"})}catch(e){}
boot();
})();
